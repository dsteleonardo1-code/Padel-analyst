services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fondocampo
      POSTGRES_PASSWORD: fondocampo
      POSTGRES_DB: fondocampo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fondocampo
      MINIO_ROOT_PASSWORD: fondocampo-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 fondocampo fondocampo-secret; do sleep 1; done;
      mc mb -p local/videos || true;
      exit 0;
      "

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://fondocampo:fondocampo@postgres:5432/fondocampo
      REDIS_URL: redis://redis:6379/0
      INLINE_JOBS: "0"
      S3_ENABLED: "1"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: fondocampo
      S3_SECRET_KEY: fondocampo-secret
      S3_BUCKET: videos
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - analysis:/data
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build: ./apps/api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://fondocampo:fondocampo@postgres:5432/fondocampo
      REDIS_URL: redis://redis:6379/0
      INLINE_JOBS: "0"
      S3_ENABLED: "1"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: fondocampo
      S3_SECRET_KEY: fondocampo-secret
      S3_BUCKET: videos
      DATA_DIR: /data
    volumes:
      - analysis:/data
    depends_on:
      - postgres
      - redis
      - api

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  minio:
  analysis:
